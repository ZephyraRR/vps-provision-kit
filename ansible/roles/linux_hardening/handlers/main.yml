---
# Handlers only act on a real init system, so the same role can be tested in a container.
- name: Reload sshd
  ansible.builtin.systemd:
    name: ssh
    state: reloaded
  when: ansible_service_mgr == 'systemd'

- name: Reload nftables
  ansible.builtin.systemd:
    name: nftables
    state: reloaded
  when: linux_hardening_firewall_apply and ansible_service_mgr == 'systemd'

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
    enabled: true
  when: linux_hardening_install_fail2ban and ansible_service_mgr == 'systemd'

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
  when: ansible_service_mgr == 'systemd'
